version: '3.8'

services:
  db:
    image: mysql:8.4
    container_name: connecthub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ConnectHub2024!
      MYSQL_DATABASE: connecthub_db
      MYSQL_USER: connecthub_user
      MYSQL_PASSWORD: ConnectHub2024!
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/sample_data.sql:/docker-entrypoint-initdb.d/02_sample.sql

  app:
    build: .
    container_name: connecthub-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: connecthub_user
      DB_PASSWORD: ConnectHub2024!
      DB_NAME: connecthub_db
      JWT_SECRET: connecthub_jwt_super_secret_key_2024_cpp_ds
      PORT: 5000
    depends_on:
      - db

volumes:
  mysql_data:
